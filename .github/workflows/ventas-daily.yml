name: Airtel CG Mail Dashboard

# 10:00 IST = 04:30 UTC. GitHub cron is always UTC.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}

jobs:
  send-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pipeline (recipients/subject/query from config.yaml)
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}   # contents of token_ventas.json
          VENTAS_WORKDIR: ${{ runner.temp }}
        run: python run_daily.py
