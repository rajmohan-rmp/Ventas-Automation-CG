# ============================================================================
# Airtel KE Mail Dashboard Automation — central configuration
# Edit THIS file to point the automation at a new mailbox / recipients /
# subject / Drive folder. All scripts read their settings from here.
# ============================================================================

# --- Source email (the daily report the automation reads) -------------------
gmail:
  # Gmail search that finds the latest source report email.
  search_query: 'subject:"CG VENTAS REPORT" has:attachment'

# --- Outgoing email (the dashboard mail the automation sends) ---------------
email:
  to:
    - raj.mohan@6dtech.co.in
  cc:
    - hari.krishnan@6dtech.co.in
  bcc: []
  # {report_date} and {customer} are filled automatically. {customer} comes from
  # branding.country / branding.country_code below, so you don't repeat the name here.
  subject_template: "Ventas Daily Dashboard | {customer} | {report_date} (Last 7 Days)"
  # The quantity (log-scale) slide is always inside the attached deck. Set this to true
  # to ALSO show its image in the mail body; false = attachment only (default).
  include_quantity_in_body: true

# --- Google Drive upload ----------------------------------------------------
drive:
  upload: true
  folder_id: "1mXQKzC-E7qayiCD3o4xP0wRY-1c9RG1U"

# --- Report window ----------------------------------------------------------
report:
  window_days: 7          # number of trailing days shown
  exclude_report_day: true  # window ends the day BEFORE the report date

# --- Branding shown on the slides -------------------------------------------
# Country + country_code are the SINGLE place that sets the operator name.
# Everything (slides, quantity deck, email body, subject) shows
# "Airtel <country> (<country_code>)" derived from these two values.
# To re-point the whole setup at another operator, change ONLY these two lines
# (e.g. country: "Congo", country_code: "CG").
branding:
  title: "VENTAS DAILY DASHBOARD"
  country: "Congo"
  country_code: "CG"
  company: "6D Technologies"
  # customer: optional override. Leave blank to auto-use "Airtel <country> (<code>)".
  customer: ""

# --- OAuth (do not change unless you know why) ------------------------------
oauth:
  scopes:
    - https://www.googleapis.com/auth/gmail.readonly
    - https://www.googleapis.com/auth/gmail.send
    - https://www.googleapis.com/auth/drive.file

# --- Where the secret credentials come from (VALUES are NOT stored here) -----
# The repo must never contain the real token or credentials.json.
auth:
  token_env: TOKEN_JSON            # GitHub/CI: repository Secret name holding token_ventas.json contents
  sa_key_env: SA_KEY_JSON          # optional CI secret name for a service-account key JSON
  delegated_user: ""               # optional: Workspace mailbox to impersonate (service-account mode)
  credentials_file: credentials.json   # local OAuth client file (git-ignored)
  token_file: token_ventas.json        # local token file (git-ignored)
  secrets_file: secrets.yaml            # optional LOCAL secrets file (git-ignored; see secrets.example.yaml)
